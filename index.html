<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  </head>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      height: 100vh;
      width: 100vw;
      position: relative;
      padding: 0;
      margin: 0;
      touch-action: none;
      overflow: hidden;
    }
    html {
      overflow: hidden;
    }
    button {
      box-shadow: 0 1px 2px black;
      cursor: pointer;
      margin: 3px;
      font-size: 1.5em;
      color: black;
    }
    @media (max-width: 800px) {
      button {
        font-size: 1em;
      }
    }
    .content-item {
      position: absolute;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    .text-content-item {
      /* these styles dont mean anything on a canvas lmao, im just using this class to know if it's a text content item */
      overflow-wrap: break-word;
      font-family: "Impact";
    }
    .toolbar {
      position: fixed;
      height: min-content;
      width: 100%;
      display: flex;
      justify-content: center;
      pointer-events: none;
      z-index: 1;
      user-select: none;
      -webkit-user-select: none;
    }
    .toolbar * {
      pointer-events: all;
    }
    .content-area {
      position: absolute;
      width: 100%;
      height: 100%;
    }
    .root {
      height: 100%;
      width: 100%;
    }
    .focused {
      border: none;
    }
    .grabbing {
      cursor: grabbing !important;
    }
    .content-item-container {
      height: min-content;
      width: min-content;
    }
    .focus-ui-controls {
      pointer-events: all;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      cursor: grab;
      position: absolute;
      background-color: blue;
    }
  </style>
  <body>
    <div class="root">
      <div class="toolbar">
        <button id="paste-btn">paste</button>
        <button id="add-txt-btn">add text</button>
        <button
          id="eraser-control"
          style="display: flex; justify-content: center; align-items: center"
        >
          <div
            style="
              width: 20px;
              height: 20px;
              background-color: #aa336a;
              border-top-left-radius: 5px;
              border-bottom-left-radius: 5px;
              pointer-events: none;
            "
          ></div>
          <div
            style="
              width: 20px;
              height: 20px;
              background-color: #ffffdd;
              border-top-right-radius: 5px;
              border-bottom-right-radius: 5px;
              pointer-events: none;
            "
          ></div>
        </button>
        <div
          popover="manual"
          id="text-controls-menu"
          style="border-radius: 3px; border: none; box-shadow: grey 0 3px 5px; padding: 10px"
        >
          <div style="display: flex; flex-direction: column">
            <label for="text-value">text value:</label>
            <input id="text-value" type="text" name="text-value" />
            <label for="text-font-size">font size:</label>
            <input
              id="text-font-size"
              name="text-font-size"
              type="range"
              min="2"
              max="50"
              value="20"
              disabled
            />
            <label>colors for:</label>
            <div style="display: flex; align-items: center; justify-content: center">
              <input
                name="text-color-type"
                type="radio"
                id="text"
                value="text"
                checked
              />
              <label for="text">text</label>
              <input
                name="text-color-type"
                type="radio"
                id="background"
                value="background"
              />
              <label for="background">bg</label>
            </div>
            <label for="text-color-r">red:</label>
            <input
              id="text-color-r"
              type="range"
              min="0"
              max="255"
              value="0"
              name="text-color-r"
              disabled
            />
            <label for="text-color-g">green:</label>
            <input
              id="text-color-g"
              type="range"
              min="0"
              max="255"
              value="0"
              name="text-color-g"
              disabled
            />
            <label for="text-color-b">blue:</label>
            <input
              id="text-color-b"
              type="range"
              min="0"
              max="255"
              value="0"
              name="text-color-b"
              disabled
            />
            <label for="text-color-a">alpha:</label>
            <input
              id="text-color-a"
              type="range"
              min="0"
              max="255"
              value="255"
              name="text-color-a"
              disabled
            />
          </div>
        </div>
      </div>
      <div class="content-area"></div>
    </div>
  </body>
  <script>
    function parseGIF(arrayBuffer, log=false) {
      const gif = {}
      /*
      https://giflib.sourceforge.net/gifstandard/GIF89a.html
      header: GIF + VERSION
      logical screen descriptor: width, height, flags indicating info such as global color table presence
      optional global color table
      image descriptor: contains image position and size info, could be optionally preceded by a graphic control extension block
      local color table: optional
      image data
      */
      const uint8 = new Uint8Array(arrayBuffer)
      gif.buffer = uint8
      const isGIF = uint8.slice(0, 3).reduce((acc, elem) => acc + String.fromCharCode(elem), "") === "GIF"
      if (!isGIF) return null;
      let gif_idx = 6; // skipping first six bytes which are GIF (3 bytes) and the version (3 bytes)
      const screenWidth = (uint8[gif_idx]) | (uint8[gif_idx + 1] << 8)
      const screenHeight = (uint8[gif_idx + 2]) | (uint8[gif_idx + 3] << 8)
      const packedFields = uint8[gif_idx + 4]
      const globalColorTableExists = packedFields >> 7
      gif.screenWidth = screenWidth
      gif.screenHeight = screenHeight
      gif.globalColorTableExists = globalColorTableExists
      const colorResolution = (packedFields >> 4) & 0b111
      gif.colorResolution = colorResolution
      const sortFlag = (packedFields >> 3) & 0b1
      gif.sortFlag = sortFlag
      const globalColorTableSize = packedFields & 0b111 // size is calculated by 2 ^ (globalColorTableSize + 1)
      const backgroundColorIndex = uint8[gif_idx + 5]
      gif.backgroundColorIndex = backgroundColorIndex
      const pixelAspectRatio = uint8[gif_idx + 6] // used in the formula (pixelAspectRatio + 15) / 64
      gif.pixelAspectRatio = pixelAspectRatio
      const actualGlobalColorTableSize = 3 * 2 ** (globalColorTableSize + 1)
      if (log) console.log('gct size', 2 ** (globalColorTableSize + 1))
      gif_idx += 7
      if (globalColorTableExists) {
        const globalColorBytes = uint8.slice(gif_idx, gif_idx + actualGlobalColorTableSize)
        gif.globalColorTable = [gif_idx, actualGlobalColorTableSize]
        gif_idx += actualGlobalColorTableSize
      }
      let imageDescriptorCounter = 0;
      let endOfInfoCounter = 0;
      let imageData = []
      gif.dataBlocks = []
      let gce = null
      const startOfGifParseTime = performance.now()
      while (gif_idx < uint8.length) {
        if (uint8[gif_idx] === 0x21) {
          gif_idx += 1;
          switch (uint8[gif_idx]) {
            case 0xf9: {
              // graphic control extension
              if (log) console.log('gce')
              const size = 4 // fixed number
              const packedFields = uint8[gif_idx + 2]
              const disposalMethod = (packedFields >> 2) & 0b111
              const userInputFlag = (packedFields >> 1) & 0b1
              const transparentColorFlag = (packedFields) & 0b1
              const delayTime = (uint8[gif_idx + 3]) | (uint8[gif_idx + 4] << 8) // number of 1/100 seconds
              const transparentColorIndex = uint8[gif_idx + 5]
              gce = { disposalMethod, userInputFlag, transparentColorFlag, delayTime, transparentColorIndex }
              if (uint8[gif_idx + 6] !== 0) throw Error("should be block terminator")
              gif_idx += 7
              break;
            }
            case 0xff: // application extension
              {
                gce = null
                if (log) console.log("application")
                const blockSize = 11 // fixed size
                const applicationId = uint8.slice(gif_idx + 2, gif_idx + 2 + 8)
                if (log) console.log(applicationId.reduce((acc, byte) => acc + String.fromCharCode(byte), ""))
                const applicationAuthCode = uint8.slice(gif_idx + 2 + 8, gif_idx + 2 + 8 + 3)
                gif_idx += 2 + 8 + 3
                const applicationDataSegments = []
                while (uint8[gif_idx] !== 0) {
                  const dataSubBlockSize = uint8[gif_idx]
                  applicationDataSegments.push([gif_idx + 1, dataSubBlockSize])
                  gif_idx += dataSubBlockSize + 1
                }
                gif.dataBlocks.push({ type: 'application', applicationId, applicationAuthCode, applicationDataSegments })
                gif_idx += 1
                break;
              }
            case 0xfe: // comment extension
              {
                gce = null
                if (log) console.log("comment")
                gif_idx += 1
                const commentDataBlockSegments = []
                while (uint8[gif_idx] !== 0) {
                  const dataSubBlockSize = uint8[gif_idx]
                  commentDataBlockSegments.push([gif_idx + 1, dataSubBlockSize])
                  gif_idx += dataSubBlockSize + 1
                }
                gif.dataBlocks.push({ type: 'comment', commentDataBlockSegments })
                gif_idx += 1
                break;
              }
            case 0x01: // plain text extension
              {
                if (log) console.log("plain text")
                const blockSize = 12 // fixed size
                const textGridLeftPos = (uint8[gif_idx + 1]) | (uint8[gif_idx + 2] << 8)
                const textGridTopPos = (uint8[gif_idx + 3]) | (uint8[gif_idx + 4] << 8)
                const textGridWidth = (uint8[gif_idx + 5]) | (uint8[gif_idx + 6] << 8)
                const textGridHeight = (uint8[gif_idx + 7]) | (uint8[gif_idx + 8] << 8)
                const charCellWidth = uint8[gif_idx + 9]
                const charCellHeight = uint8[gif_idx + 10]
                const textForegroundColorIdx = uint8[gif_idx + 11]
                const textBackgroundColorIdx = uint8[gif_idx + 12]
                gif_idx += 13
                const plainTextDataSegments = []
                while (uint8[gif_idx] !== 0) {
                  const dataSubBlockSize = uint8[gif_idx]
                  plainTextDataSegments.push([gif_idx + 1, dataSubBlockSize])
                  gif_idx += 1 + dataSubBlockSize
                }
                gif.dataBlocks.push({ gce, textGridLeftPos, textGridTopPos, textGridWidth, textGridHeight, charCellWidth, charCellHeight, textForegroundColorIdx, textForegroundColorIdx, plainTextDataSegments })
                gif_idx += 1
                break;
              }
            default: {
              throw Error(`ok what the fuck is this ${uint8[gif_idx + 1]}`)
            }
          }
        } else if (uint8[gif_idx] === 0x3b) { // trailer block
          break;
        } else if (uint8[gif_idx] === 0x2c) {
          if (log) console.log("image descriptor")
          imageDescriptorCounter++
          const imageLeftPos = (uint8[gif_idx + 1]) | (uint8[gif_idx + 2] << 8)
          const imageTopPos = (uint8[gif_idx + 3]) | (uint8[gif_idx + 4] << 8)
          const imageWidth = (uint8[gif_idx + 5]) | (uint8[gif_idx + 6] << 8)
          const imageHeight = (uint8[gif_idx + 7]) | (uint8[gif_idx + 8] << 8)
          const packedFields = uint8[gif_idx + 9]
          const localColorTableExists = (packedFields >> 7) & 0b1
          const interlaceFlag = (packedFields >> 6) & 0b1
          const sortFlag = (packedFields >> 5) & 0b1
          const reserved = (packedFields >> 3) & 0b11
          const localColorTableSize = packedFields & 0b111
          gif_idx += 10
          let localColorTableSegment = null;
          const actualLocalColorTableSize = 3 * 2 ** (localColorTableSize + 1)
          if (localColorTableExists) {
            localColorTableSegment = [gif_idx, actualLocalColorTableSize]
            gif_idx += actualLocalColorTableSize
          }
          const imageDescriptor = { imageLeftPos, imageTopPos, imageWidth, imageHeight, interlaceFlag, sortFlag }
          const lzwMinCodeSize = uint8[gif_idx] // gif spec says code size starts at min code size + 1 bits, up to 12 bits
          if (log) console.log(lzwMinCodeSize, gif_idx, 'idx of image data')
          gif_idx += 1
          const clearCode = 2 ** lzwMinCodeSize
          const endOfInfo = clearCode + 1
          const bytes = []
          while (gif_idx < uint8.length) {
            const dataSubBlockSize = uint8[gif_idx]
            if (dataSubBlockSize === 0) break;
            for (let i = gif_idx + 1; i < gif_idx + 1 + dataSubBlockSize; ++i) bytes.push(uint8[i])
            gif_idx += 1 + dataSubBlockSize
          }
          let bit_pos = 0
          let currentCodeBitLength = lzwMinCodeSize + 1
          const table = new Array(258)
          let prev = null
          const resetTable = () => {
            prev = null
            table.length = 0
            for (let code = 0; code < clearCode; ++code) {table[code] = [code]}
            table[clearCode] = []; // clearCode index
            table[endOfInfo] = null // endOfInfo index
            currentCodeBitLength = lzwMinCodeSize + 1
          }
          const imageData = []
          const start = performance.now()
          outer: while(Math.floor(bit_pos / 8) < bytes.length) {
            let idx = Math.floor(bit_pos / 8)
            let bit_pos_in_byte = bit_pos % 8
            const byte = bytes[idx]
            let code = (byte >> bit_pos_in_byte) & ((1 << currentCodeBitLength) - 1)
            let lengthLeft = currentCodeBitLength - (8 - bit_pos_in_byte)
            while (lengthLeft > 0) {
              // only time this while loop runs is if lengthLeft is positive which only occurs when reading across byte boundaries is needed
              ++idx
              const nextByte = bytes[idx]
              const part_of_code2 = nextByte & ((1 << lengthLeft) - 1)
              code |= part_of_code2 << (currentCodeBitLength - lengthLeft)
              lengthLeft -= 8
            }
            bit_pos += currentCodeBitLength

            switch (code) {
              case endOfInfo:{ endOfInfoCounter++; break outer }
              case clearCode: { resetTable(); continue }
            }

            if (prev !== null) {
              if (table[code] === undefined) { // sometimes the encoders will output a code that is of the maximum table size
                if (code !== table.length) {
                  console.error("only codes that would not be in the table that are also valid are ones that equal the table length; anything else is invalid data")
                  debugger
                }
                table.push(table[prev].concat(table[prev][0]))
              } else {
                table.push(table[prev].concat(table[code][0]))
              }
              if (table.length === 2 ** currentCodeBitLength && currentCodeBitLength < 12) {
                ++currentCodeBitLength
              }
            }
            imageData.push.apply(imageData, table[code])
            prev = code
          }
          gif.dataBlocks.push({ type: "graphic block", gce, imageDescriptor, localColorTableSegment, imageData })
          if (log) console.log(performance.now() - start, 'time taken to decode image lzw data in ms')
          if (uint8[gif_idx] !== 0) throw Error("this should've been the data sub block terminator")
          gif_idx += 1
        } else {
          console.log(uint8[gif_idx], gif_idx, uint8.length)
          throw Error("UNHANDLED")
        }
      }
      if (log) console.log('time to parse entire gif in ms', performance.now() - startOfGifParseTime, imageDescriptorCounter)
      console.assert(imageDescriptorCounter === endOfInfoCounter)
      return gif
    }
  </script>
  <script>
    const root = document.querySelector(".root");
    const content_area = document.querySelector(".content-area");
    const paste_btn = document.getElementById("paste-btn");
    const add_txt_btn = document.getElementById("add-txt-btn");
    const eraserControl = document.getElementById("eraser-control");
    let eraserEnabled = false;
    const eraser = document.createElement("div");
    eraser.style.width = "50px";
    eraser.style.height = "50px";
    eraser.style.position = "absolute";
    eraser.style.borderRadius = "100%";
    eraser.style.backgroundColor = "#AA336A";
    eraser.style.cursor = "grabbing";
    eraserControl.onclick = (e) => {
      eraserEnabled = !eraserEnabled;
      if (eraserEnabled) {
        root.appendChild(eraser);
      } else {
        eraser.remove();
      }
    };
    function moveEraser(e) {
      const { x, y, width, height } = eraser.getBoundingClientRect();
      const xCenter = x + width / 2;
      const yCenter = y + height / 2;
      const matrix = new DOMMatrix(getComputedStyle(eraser).transform);
      matrix.translateSelf(e.clientX - xCenter, e.clientY - yCenter);
      eraser.style.transform = matrix.toString();
    }
    const textContentItemFontSize = document.getElementById("text-font-size");
    const textContentItemColorRED = document.getElementById("text-color-r");
    const textContentItemColorGREEN = document.getElementById("text-color-g");
    const textContentItemColorBLUE = document.getElementById("text-color-b");
    const textContentItemColorALPHA = document.getElementById("text-color-a");
    const textControlsMenu = document.getElementById("text-controls-menu");
    const textControlsMenuChildren = document.querySelectorAll("#text-controls-menu input");
    const textValue = document.getElementById("text-value");
    let contentAreaMatrix = new DOMMatrix();

    let selectedFocusUIControl = null;
    let offsetForPointer = null;

    function createFocusControls(type) {
      const scale1 = document.createElement("div");
      scale1.id = "scale1";
      scale1.style.height = "30px";
      scale1.style.width = "30px";

      const scale2 = document.createElement("div");
      scale2.id = "scale2";
      scale2.style.height = "30px";
      scale2.style.width = "30px";

      const scale3 = document.createElement("div");
      scale3.id = "scale3";
      scale3.style.height = "30px";
      scale3.style.width = "30px";

      const scale4 = document.createElement("div");
      scale4.id = "scale4";
      scale4.style.height = "30px";
      scale4.style.width = "30px";

      const horizontalRadius = 30;
      const verticalRadius = 30;
      const cssString = `${horizontalRadius}px ${verticalRadius}px`;
      scale1.style.borderTopLeftRadius = cssString;
      scale1.style.borderTopRightRadius = cssString;
      scale1.style.borderBottomLeftRadius = cssString;

      scale2.style.borderTopLeftRadius = cssString;
      scale2.style.borderTopRightRadius = cssString;
      scale2.style.borderBottomRightRadius = cssString;

      scale3.style.borderTopLeftRadius = cssString;
      scale3.style.borderBottomLeftRadius = cssString;
      scale3.style.borderBottomRightRadius = cssString;

      scale4.style.borderTopRightRadius = cssString;
      scale4.style.borderBottomLeftRadius = cssString;
      scale4.style.borderBottomRightRadius = cssString;

      const rotateFocusControl = document.createElement("div");
      rotateFocusControl.style.width = "25px";
      rotateFocusControl.style.height = "25px";
      rotateFocusControl.style.borderRadius = "30px 30px";

      let topFocusBorder = document.createElement("div");
      topFocusBorder.style.height = "2px";
      let leftFocusBorder = document.createElement("div");
      leftFocusBorder.style.width = "2px";
      let rightFocusBorder = document.createElement("div");
      rightFocusBorder.style.width = "2px";
      let bottomFocusBorder = document.createElement("div");
      bottomFocusBorder.style.height = "2px";

      scale1.classList.add("focus-ui-controls");
      scale2.classList.add("focus-ui-controls");
      scale3.classList.add("focus-ui-controls");
      scale4.classList.add("focus-ui-controls");
      rotateFocusControl.classList.add("focus-ui-controls");
      topFocusBorder.classList.add("focus-ui-controls");
      leftFocusBorder.classList.add("focus-ui-controls");
      rightFocusBorder.classList.add("focus-ui-controls");
      bottomFocusBorder.classList.add("focus-ui-controls");

      scale1.onpointerdown = (e) => {
        if (focused_item === null) {
          return;
        }
        selectedFocusUIControl = scale1;
        const [, , , bottomRightCorner] = calculateCornersBasedOnRotation(scale1);
        const [bottomRightX, bottomRightY] = bottomRightCorner;
        offsetForPointer = [e.clientX - bottomRightX, e.clientY - bottomRightY];
      };
      scale2.onpointerdown = (e) => {
        if (focused_item === null) {
          return;
        }
        selectedFocusUIControl = scale2;
        const [, , bottomLeftCorner] = calculateCornersBasedOnRotation(scale2);
        const [bottomLeftX, bottomLeftY] = bottomLeftCorner;
        offsetForPointer = [e.clientX - bottomLeftX, e.clientY - bottomLeftY];
      };
      scale3.onpointerdown = (e) => {
        if (focused_item === null) {
          return;
        }
        selectedFocusUIControl = scale3;
        const [, topRightCorner] = calculateCornersBasedOnRotation(scale3);
        const [topRightX, topRightY] = topRightCorner;
        offsetForPointer = [e.clientX - topRightX, e.clientY - topRightY];
      };
      scale4.onpointerdown = (e) => {
        if (focused_item === null) {
          return;
        }
        selectedFocusUIControl = scale4;
        const [topLeftCorner] = calculateCornersBasedOnRotation(scale4);
        const [topLeftX, topLeftY] = topLeftCorner;
        offsetForPointer = [e.clientX - topLeftX, e.clientY - topLeftY];
      };
      rotateFocusControl.onpointerdown = (e) => {
        if (focused_item === null) {
          return;
        }
        selectedFocusUIControl = rotateFocusControl;
      };
      let textContentItemControls;
      if (type === "text") {
        textContentItemControls = document.createElement("div")
        textContentItemControls.id = "text-controls"
        textContentItemControls.setAttribute("popovertarget", "text-controls-menu")
        textContentItemControls.classList.add("focus-ui-controls")
        textContentItemControls.textContent = "t"
        textContentItemControls.fontWeight = "bold"

        textContentItemControls.style.width = "25px";
        textContentItemControls.style.height = "25px";
        textContentItemControls.style.borderRadius = "30px 30px";
        textContentItemControls.style.display = "flex";
        textContentItemControls.style.alignItems = "center";
        textContentItemControls.style.justifyContent = "center";
        textContentItemControls.style.color = "white"

        textContentItemControls.onpointerdown = (e) => {
          selectedFocusUIControl = textContentItemControls
          syncTextControls()
          textControlsMenu.togglePopover()
        }
      }
      let gifFrameScroller;
      if (type === "gif") {
        gifFrameScroller = document.createElement("input")
        gifFrameScroller.setAttribute("type", "range")
        gifFrameScroller.classList.add("focus-ui-controls")
        gifFrameScroller.setAttribute("value", 0)
        gifFrameScroller.onpointerdown = () => {
          selectedFocusUIControl = gifFrameScroller
        }
      }
      return {
        scale1,
        scale2,
        scale3,
        scale4,
        topFocusBorder,
        leftFocusBorder,
        rightFocusBorder,
        bottomFocusBorder,
        rotateFocusControl,
        textContentItemControls,
        gifFrameScroller
      };
    }

    let focused_item = null;
    let pointer_down = false;
    let erasing = false;

    const contentItems = [];

    function getContentItemInfo() {
      return contentItems.find((contentItem) => contentItem.item === focused_item);
    }

    function getFocusItemWidthHeight() {
      if (focused_item === null) throw Error("why are you calling this when focused_item is null");
      // handles both images and divs for getting the sizes
      const widthvalue =
        focused_item.classList.contains("text-content-item") ? parseInt(focused_item.style.width) : focused_item.width;
      const heightvalue =
        focused_item.classList.contains("text-content-item")
          ? parseInt(focused_item.style.height)
          : focused_item.height;
      return [widthvalue, heightvalue];
    }

    /* this function should only be used for focus controls or the focused item */
    function calculateCornersBasedOnRotation(element) {
      if (element === null) throw Error("element is null");
      const { x, y, width, height } = element.getBoundingClientRect();
      const x_center = x + width / 2;
      const y_center = y + height / 2;
      const matrix = new DOMMatrix(getComputedStyle(focused_item).transform);
      const scaleX = Math.sqrt(matrix.a ** 2 + matrix.b ** 2);
      const scaleY = Math.sqrt(matrix.c ** 2 + matrix.d ** 2);
      const [widthvalue, heightvalue] = getFocusItemWidthHeight();
      const actualHalfWidth =
        element === focused_item
          ? (widthvalue / 2) * contentAreaMatrix.a * scaleX
          : parseInt(element.style.width) / 2;
      const actualHalfHeight =
        element === focused_item
          ? (heightvalue / 2) * contentAreaMatrix.a * scaleY
          : parseInt(element.style.height) / 2;
      const dist = Math.hypot(actualHalfWidth, actualHalfHeight);

      function getXY(angle_offset) {
        const contentItemInfo = getContentItemInfo(focused_item);
        if (contentItemInfo === undefined) throw Error("contentItemInfo is undefined");
        const focusItemRotation = contentItemInfo.focusItemRotation;
        return [
          Math.cos(focusItemRotation + angle_offset) * dist + x_center,
          Math.sin(focusItemRotation + angle_offset) * dist + y_center,
        ];
      }

      const angles = [
        -Math.acos(-actualHalfWidth / dist),
        -Math.acos(actualHalfWidth / dist),
        Math.acos(-actualHalfWidth / dist),
        Math.acos(actualHalfWidth / dist),

      if (!parsedDocument.querySelector("parsererror")) {
        const svg = parsedDocument.documentElement.outerHTML;
        const imageUrl = `data:image/svg+xml;base64,${btoa(svg)}`;
        createNewImageContentItem(imageUrl);
      } else {
        if (focused_item && focused_item.classList.contains("text-content-item")) {
        } else {
          addTextContentItem();
        }
      }
    }
    async function getImageDataFromGraphicBlock(gif, graphicBlock) {
      const width = graphicBlock.imageDescriptor.imageWidth
      const height = graphicBlock.imageDescriptor.imageHeight
      const imageDataForCanvas = new ImageData(width, height)
      console.assert(width * height === graphicBlock.imageData.length)
      const colorTableSegment = graphicBlock.localColorTableSegment ? graphicBlock.localColorTableSegment : gif.globalColorTable
      if (!colorTableSegment) throw Error("no color table")
      const [start, size] = colorTableSegment
      const transparentIndex = graphicBlock.gce.transparentColorIndex
      const interlaced = graphicBlock.imageDescriptor.interlaceFlag
      if (interlaced) {
        const passes = [
          [width * 8, 0],
          [width * 8, width * 4],
          [width * 4, width * 2],
          [width * 2, width * 1],
        ]
        let imageDataIdx = 0
        for (let passIdx = 0; passIdx < passes.length; ++passIdx) {
          const [step, offset] = passes[passIdx]
          for (let i = offset; i < graphicBlock.imageData.length; i += step) {
            for (let j = i; j < i + width; ++j) {
              const idx = graphicBlock.imageData[imageDataIdx++]
              if (idx === transparentIndex && graphicBlock.gce.transparentColorFlag) {
                continue
              }
              const [r, g, b] = [gif.buffer[start + idx * 3], gif.buffer[start + idx * 3 + 1], gif.buffer[start + idx * 3 + 2]]
              imageDataForCanvas.data[j * 4] = r
              imageDataForCanvas.data[j * 4 + 1] = g
              imageDataForCanvas.data[j * 4 + 2] = b
              imageDataForCanvas.data[j * 4 + 3] = 255
            }
          }
        }
      } else {
        for (let i = 0; i < graphicBlock.imageData.length; ++i) {
          const idx = graphicBlock.imageData[i]
          if (idx === transparentIndex && graphicBlock.gce.transparentColorFlag) {
            continue
          }
          const [r, g, b] = [gif.buffer[start + idx * 3], gif.buffer[start + idx * 3 + 1], gif.buffer[start + idx * 3 + 2]]
          imageDataForCanvas.data[i * 4] = r
          imageDataForCanvas.data[i * 4 + 1] = g
          imageDataForCanvas.data[i * 4 + 2] = b
          imageDataForCanvas.data[i * 4 + 3] = 255
        }
      }
      return await createImageBitmap(imageDataForCanvas)
    }
    async function addGIFContentItem(gif) {
      if (focused_item) removeFocusControls();
      const graphicBlocks = gif.dataBlocks.filter(datablock => datablock.type && datablock.type === "graphic block")
      const imageBitmaps = await Promise.all(graphicBlocks.map(async block => await getImageDataFromGraphicBlock(gif, block)))
      const canvas = document.createElement("canvas")
      const ctx = canvas.getContext("2d")
      canvas.width = gif.screenWidth
      canvas.height = gif.screenHeight
      canvas.draggable = false
      canvas.classList.add("content-item")
      canvas.classList.add("gif-content-item")
      const controls = createFocusControls("gif")
      controls.gifFrameScroller.setAttribute("min", 0)
      controls.gifFrameScroller.setAttribute("max", imageBitmaps.length - 1)
      const backgroundColor = gif.globalColorTableExists ? [
        gif.buffer[gif.globalColorTable[0] + gif.backgroundColorIndex * 3],
        gif.buffer[gif.globalColorTable[0] + gif.backgroundColorIndex * 3 + 1],
        gif.buffer[gif.globalColorTable[0] + gif.backgroundColorIndex * 3 + 2],
        255
      ] : [0, 0, 0, 0]
      controls.gifFrameScroller.oninput = (e) => {
        ctx.clearRect(0, 0, canvas.width, canvas.height)
        const frame = parseInt(e.target.value)
        for (let i = 0; i < frame; ++i) {
          if (i) {
            const x = graphicBlocks[i - 1].imageDescriptor.imageLeftPos
            const y = graphicBlocks[i - 1].imageDescriptor.imageTopPos
            const width = graphicBlocks[i - 1].imageDescriptor.imageWidth
            const height = graphicBlocks[i - 1].imageDescriptor.imageHeight
            switch (graphicBlocks[i - 1].gce.disposalMethod) {
              case 0: break
              case 1: break
              case 2:
                ctx.fillStyle = `rgb(${backgroundColor[0]} ${backgroundColor[1]} ${backgroundColor[2]} / ${backgroundColor[3] / 255})`
                ctx.fillRect(x, y, width, height)
                break
              case 3:
                ctx.clearRect(x, y, width, height)
                for (let j = 0; j < i - 1; ++j) {
                  ctx.drawImage(imageBitmaps[j], graphicBlocks[j].imageDescriptor.imageLeftPos, graphicBlocks[j].imageDescriptor.imageTopPos)
                }
                break
              default: break
            }
          }
          ctx.drawImage(imageBitmaps[i], graphicBlocks[i].imageDescriptor.imageLeftPos, graphicBlocks[i].imageDescriptor.imageTopPos)
        }
        ctx.drawImage(imageBitmaps[frame], graphicBlocks[frame].imageDescriptor.imageLeftPos, graphicBlocks[frame].imageDescriptor.imageTopPos)
      }
      contentItems.push({
        item: canvas,
        focusItemRotation: 0,
        controls,
        canvas,
        drawContext: ctx,
        gif,
        imageBitmaps
      });
      focused_item = canvas;
      content_area.appendChild(canvas);
      ctx.drawImage(imageBitmaps[0], graphicBlocks[0].imageDescriptor.imageLeftPos, graphicBlocks[0].imageDescriptor.imageTopPos)
    }
    function getDataTransferContent(dataTransfer) {
      const file = dataTransfer.files[0];
      if (file) {
        if (file.type === "image/gif") {
          file.arrayBuffer().then(arrayBuffer => {
            const gif = parseGIF(arrayBuffer, true)
            addGIFContentItem(gif)
          }).catch(e => console.error(e))
        } else {
          const imageUrl = URL.createObjectURL(file);
          createNewImageContentItem(imageUrl);
        }
      } else {
        const idxOfURI_List = dataTransfer.types.indexOf("text/uri-list")
        if (dataTransfer.items[idxOfURI_List]) {
          dataTransfer.items[idxOfURI_List].getAsString(async t => {
            const blob = await fetch(t).then(r => r.blob())
            const arrayBuffer = await blob.arrayBuffer()
            const gif = parseGIF(arrayBuffer, true)
            addGIFContentItem(gif)
          })
        } else {
          const idxOfTxtPlain = dataTransfer.types.indexOf("text/plain");
          if (dataTransfer.items[idxOfTxtPlain]) {
            dataTransfer.items[idxOfTxtPlain].getAsString((t) => {
              trySVGContentItemOrMakeText(t)
            });
          }
        }
      }
    }
    function getContentClipboardOrDrop(e) {
      if (e.clipboardData || e.dataTransfer) {
        getDataTransferContent(e.clipboardData || e.dataTransfer);
      } else {
        navigator.clipboard
          .read()
          .then((items) => {
            const images = items.filter((i) => {
              return i.types.some((t) => t.includes("image") || t.includes("text"));
            });
            images.forEach((i) => {
              const image_mime_type = i.types.find((t) => t.includes("image"));
              if (image_mime_type) {
                i.getType(image_mime_type).then((blob) => {
                  const imageUrl = URL.createObjectURL(blob);
                  createNewImageContentItem(imageUrl);
                });
              }
              const text_plain_svg = i.types.find((t) => t === "text/plain");
              if (text_plain_svg) {
                i.getType(text_plain_svg).then((blob) => {
                  blob.text().then((t) => {
                    trySVGContentItemOrMakeText(t);
                  });
                });
              }
            });
          })
          .catch((e) => console.error(e));
      }
    }
    paste_btn.onclick = getContentClipboardOrDrop;
    add_txt_btn.onclick = addTextContentItem;
    window.addEventListener("drop", (e) => e.preventDefault());
    document.addEventListener("drop", getContentClipboardOrDrop);
    document.addEventListener("dragover", (e) => e.preventDefault());
    document.addEventListener("paste", getContentClipboardOrDrop);
    document.addEventListener("pointermove", pointerMoveHandler);
    document.addEventListener("pointerup", pointerUpHandler);
    document.addEventListener("pointerdown", pointerDownHandler);
    document.addEventListener("copy", async () => {
      if (focused_item) {
        // using width and height properties here because the focused_item in this context should
        // always be an image content item
        const { canvas } = getContentItemInfo(focused_item);
        canvas.toBlob(async (blob) => {
          let clipboardData = { "image/png": blob };
          await navigator.clipboard.write([new ClipboardItem(clipboardData)]);
        });
      }
    });
    document.addEventListener(
      "wheel",
      (e) => {
        if (e.deltaMode === WheelEvent.DOM_DELTA_PIXEL) {
          e.preventDefault();
          const { x, y, width, height } = content_area.getBoundingClientRect();
          if (e.ctrlKey) {
            // zoom event
            // ctrlKey is true when zooming
            let scale = Math.sign(e.deltaY) === 1 ? 0.97 : 1.03;
            const diff_x = e.clientX - (x + width / 2);
            const diff_y = e.clientY - (y + height / 2);
            contentAreaMatrix.scaleSelf(
              scale,
              scale,
              scale,
              diff_x / contentAreaMatrix.a,
              diff_y / contentAreaMatrix.a,
            );
          } else {
            // moving around event
            contentAreaMatrix.translateSelf(-e.deltaX, -e.deltaY);
          }
          content_area.style.transform = contentAreaMatrix.toString();
          alignFocusControls();
        }
      },
      { passive: false },
    );
    function drawText(s) {
      if (focused_item === null) throw Error("why did you try to draw without focused item")
      if (!focused_item.classList.contains("text-content-item")) throw Error("why drawing text with non text content item")
      const contentItem = getContentItemInfo()
      const { drawContext, textContent, backgroundColor, fontSize, fontFamily, fontColor } = contentItem
      drawContext.clearRect(0, 0, focused_item.width, focused_item.height)
      const renderingFontSize = fontSize * devicePixelRatio
      drawContext.font = `${renderingFontSize}px ${fontFamily}`
      drawContext.fillStyle = backgroundColor
      drawContext.fillRect(0, 0, focused_item.width, focused_item.height)
      const new_string = contentItem.textContent.join("") + s
      const new_splits = []
      let start = 0
      let idx = 0
      while (idx < new_string.length) {
        const { width  } = drawContext.measureText(new_string.slice(start, idx))
        const { width: widthOfLetter } = drawContext.measureText(new_string.slice(idx - 1, idx))
        if (width + widthOfLetter > focused_item.width) {
          new_splits.push(new_string.slice(start, idx))
          start = idx
        }
        idx += 1
      }
      new_splits.push(new_string.slice(start, idx))
      let y = renderingFontSize
      for (const s of new_splits) {
        drawContext.fillStyle = fontColor
        drawContext.fillText(s, 0, y)
        y += renderingFontSize
      }
      contentItem.textContent = new_splits
    }
    document.addEventListener("keydown", (e) => {
      // preventing default select all behavior
      if (e.key === "a" && e.metaKey) {
        e.preventDefault();
        if (focused_item && focused_item.classList.contains("text-content-item")) {
          throw Error("TODO IMPLEMENT HIGHLIGHT FOR CANVAS")
        }
        return;
      }
      if (e.key) {
        if (e.key === "Backspace") {
          if (
            focused_item &&
            focused_item.firstChild &&
            focused_item.firstChild.id === "highlight"
          ) {
            focused_item.firstChild.remove();
          } else if (
            focused_item
          ) {
            content_area.removeChild(focused_item);
            removeFocusControls();
            const contentItemIdx = contentItems.findIndex(
              (contentItem) => contentItem.item === focused_item,
            );
            contentItems.splice(contentItemIdx, 1);
            focused_item = null;
          }
        } else if (e.key.length === 1) {
          if (
            focused_item &&
            focused_item.firstChild &&
            focused_item.firstChild.id === "highlight"
          ) {
            focused_item.firstChild.remove();
          }
          if (focused_item && focused_item.classList.contains("text-content-item") && document.activeElement !== textValue) {
            const contentItem = getContentItemInfo()
            textValue.value = contentItem.textContent.join("")
            drawText(e.key)
          }
        }
      }
    });
  </script>
