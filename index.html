<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      height: 100vh;
      width: 100vw;
      position: relative;
      padding: 0;
      margin: 0;
      touch-action: none;
      overflow: hidden;
    }
    html {
      overflow: hidden;
    }
    button {
      padding: 8px;
      border: 2px solid black;
      border-radius: 5px;
      cursor: pointer;
      margin: 3px;
      font-size: 1.5em;
      color: black;
    }
    @media (max-width: 800px) {
      button {
        font-size: 1em;
      }
    }
    .content-item {
      position: absolute;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    .toolbar {
      position: fixed;
      height: min-content;
      width: 100%;
      display: flex;
      justify-content: center;
      pointer-events: none;
      z-index: 1;
      user-select: none;
      -webkit-user-select: none;
    }
    .toolbar * {
      pointer-events: all;
    }
    .content-area {
      position: absolute;
      width: 100%;
      height: 100%;
    }
    .root {
      height: 100%;
      width: 100%;
    }
    .focused {
      border: none;
    }
    .grabbing {
      cursor: grabbing !important;
    }
    .content-item-container {
      height: min-content;
      width: min-content;
    }
    .focus-ui-controls {
      pointer-events: all;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      cursor: grab;
      position: absolute;
      background-color: blue;
    }
  </style>
  <body>
    <div class="root">
      <div class="toolbar">
        <button id="paste-btn">paste</button>
        <button id="add-txt-btn">add text</button>
        <button id="add-black-box">add black box</button>
      </div>
      <div class="content-area"></div>
    </div>
  </body>
  <script>
    const root = document.querySelector(".root");
    const content_area = document.querySelector(".content-area");
    let contentAreaMatrix = new DOMMatrix();

    let selectedFocusUIControl = null;
    let offsetForPointer = null;

    function createFocusControls() {
      const scale1 = document.createElement("div");
      scale1.id = "scale1";
      scale1.style.height = "30px";
      scale1.style.width = "30px";

      const scale2 = document.createElement("div");
      scale2.id = "scale2";
      scale2.style.height = "30px";
      scale2.style.width = "30px";

      const scale3 = document.createElement("div");
      scale3.id = "scale3";
      scale3.style.height = "30px";
      scale3.style.width = "30px";

      const scale4 = document.createElement("div");
      scale4.id = "scale4";
      scale4.style.height = "30px";
      scale4.style.width = "30px";

      const horizontalRadius = 30;
      const verticalRadius = 30;
      const cssString = `${horizontalRadius}px ${verticalRadius}px`;
      scale1.style.borderTopLeftRadius = cssString;
      scale1.style.borderTopRightRadius = cssString;
      scale1.style.borderBottomLeftRadius = cssString;

      scale2.style.borderTopLeftRadius = cssString;
      scale2.style.borderTopRightRadius = cssString;
      scale2.style.borderBottomRightRadius = cssString;

      scale3.style.borderTopLeftRadius = cssString;
      scale3.style.borderBottomLeftRadius = cssString;
      scale3.style.borderBottomRightRadius = cssString;

      scale4.style.borderTopRightRadius = cssString;
      scale4.style.borderBottomLeftRadius = cssString;
      scale4.style.borderBottomRightRadius = cssString;

      const rotateFocusControl = document.createElement("div");
      rotateFocusControl.style.width = "25px";
      rotateFocusControl.style.height = "25px";
      rotateFocusControl.style.borderRadius = "30px 30px";

      let topFocusBorder = document.createElement("div");
      topFocusBorder.style.height = "2px";
      let leftFocusBorder = document.createElement("div");
      leftFocusBorder.style.width = "2px";
      let rightFocusBorder = document.createElement("div");
      rightFocusBorder.style.width = "2px";
      let bottomFocusBorder = document.createElement("div");
      bottomFocusBorder.style.height = "2px";

      scale1.classList.add("focus-ui-controls");
      scale2.classList.add("focus-ui-controls");
      scale3.classList.add("focus-ui-controls");
      scale4.classList.add("focus-ui-controls");
      rotateFocusControl.classList.add("focus-ui-controls");
      topFocusBorder.classList.add("focus-ui-controls");
      leftFocusBorder.classList.add("focus-ui-controls");
      rightFocusBorder.classList.add("focus-ui-controls");
      bottomFocusBorder.classList.add("focus-ui-controls");

      scale1.onpointerdown = (e) => {
        if (focused_item === null) {
          return;
        }
        selectedFocusUIControl = scale1;
        const [, , , bottomRightCorner] = calculateCornersBasedOnRotation(scale1);
        const [bottomRightX, bottomRightY] = bottomRightCorner;
        offsetForPointer = [e.clientX - bottomRightX, e.clientY - bottomRightY];
      };
      scale2.onpointerdown = (e) => {
        if (focused_item === null) {
          return;
        }
        selectedFocusUIControl = scale2;
        const [, , bottomLeftCorner] = calculateCornersBasedOnRotation(scale2);
        const [bottomLeftX, bottomLeftY] = bottomLeftCorner;
        offsetForPointer = [e.clientX - bottomLeftX, e.clientY - bottomLeftY];
      };
      scale3.onpointerdown = (e) => {
        if (focused_item === null) {
          return;
        }
        selectedFocusUIControl = scale3;
        const [, topRightCorner] = calculateCornersBasedOnRotation(scale3);
        const [topRightX, topRightY] = topRightCorner;
        offsetForPointer = [e.clientX - topRightX, e.clientY - topRightY];
      };
      scale4.onpointerdown = (e) => {
        if (focused_item === null) {
          return;
        }
        selectedFocusUIControl = scale4;
        const [topLeftCorner] = calculateCornersBasedOnRotation(scale4);
        const [topLeftX, topLeftY] = topLeftCorner;
        offsetForPointer = [e.clientX - topLeftX, e.clientY - topLeftY];
      };
      rotateFocusControl.onpointerdown = (e) => {
        if (focused_item === null) {
          return;
        }
        selectedFocusUIControl = rotateFocusControl;
      };
      return {
        scale1,
        scale2,
        scale3,
        scale4,
        topFocusBorder,
        leftFocusBorder,
        rightFocusBorder,
        bottomFocusBorder,
        rotateFocusControl,
      };
    }

    let focused_item = null;
    let pointer_down = false;

    const contentItems = [];

    function getContentItemInfo() {
      return contentItems.find((contentItem) => contentItem.item === focused_item);
    }

    /* this function should only be used for focus controls or the focused item */
    function calculateCornersBasedOnRotation(element) {
      if (element === null) throw Error("element is null");
      const { x, y, width, height } = element.getBoundingClientRect();
      const x_center = x + width / 2;
      const y_center = y + height / 2;
      const matrix = new DOMMatrix(getComputedStyle(focused_item).transform);
      const scaleX = Math.sqrt(matrix.a ** 2 + matrix.b ** 2);
      const scaleY = Math.sqrt(matrix.c ** 2 + matrix.d ** 2);
      const actualHalfWidth =
        element === focused_item
          ? (focused_item.width / 2) * contentAreaMatrix.a * scaleX
          : parseInt(element.style.width) / 2;
      const actualHalfHeight =
        element === focused_item
          ? (focused_item.height / 2) * contentAreaMatrix.a * scaleY
          : parseInt(element.style.height) / 2;
      const dist = Math.hypot(actualHalfWidth, actualHalfHeight);

      function getXY(angle_offset) {
        const contentItemInfo = getContentItemInfo(focused_item);
        if (contentItemInfo === undefined) throw Error("contentItemInfo is undefined");
        const focusItemRotation = contentItemInfo.focusItemRotation;
        return [
          Math.cos(focusItemRotation + angle_offset) * dist + x_center,
          Math.sin(focusItemRotation + angle_offset) * dist + y_center,
        ];
      }

      const angles = [
        -Math.acos(-actualHalfWidth / dist),
        -Math.acos(actualHalfWidth / dist),
        Math.acos(-actualHalfWidth / dist),
        Math.acos(actualHalfWidth / dist),
      ];
      return angles.map((angle) => getXY(angle));
    }

    function addFocusControls() {
      const contentItemInfo = getContentItemInfo(focused_item);
      if (contentItemInfo === undefined) throw Error("content item info is undefined");
      const {
        scale1,
        scale2,
        scale3,
        scale4,
        rotateFocusControl,
        topFocusBorder,
        bottomFocusBorder,
        leftFocusBorder,
        rightFocusBorder,
      } = contentItemInfo.controls;
      root.appendChild(scale1);
      root.appendChild(scale2);
      root.appendChild(scale3);
      root.appendChild(scale4);
      root.appendChild(rotateFocusControl);
      root.appendChild(topFocusBorder);
      root.appendChild(bottomFocusBorder);
      root.appendChild(leftFocusBorder);
      root.appendChild(rightFocusBorder);
    }
    function removeFocusControls() {
      const contentItemInfo = getContentItemInfo(focused_item);
      if (contentItemInfo === undefined) throw Error("content item info is undefined");
      const {
        scale1,
        scale2,
        scale3,
        scale4,
        rotateFocusControl,
        topFocusBorder,
        bottomFocusBorder,
        leftFocusBorder,
        rightFocusBorder,
      } = contentItemInfo.controls;
      root.removeChild(scale1);
      root.removeChild(scale2);
      root.removeChild(scale3);
      root.removeChild(scale4);
      root.removeChild(rotateFocusControl);
      root.removeChild(topFocusBorder);
      root.removeChild(bottomFocusBorder);
      root.removeChild(leftFocusBorder);
      root.removeChild(rightFocusBorder);
    }
    function unfocus(element) {
      if (element !== focused_item && element !== selectedFocusUIControl) {
        if (focused_item && selectedFocusUIControl == null) {
          removeFocusControls();
          focused_item.classList.remove("focused");
          focused_item = null;
        }
        offsetForPointer = null;
      }
    }
    function alignFocusControls() {
      if (focused_item !== null) {
        const { x, y, width, height } = focused_item.getBoundingClientRect();

        const focusedMatrix = new DOMMatrix(getComputedStyle(focused_item).transform);
        const scaleX = Math.sqrt(focusedMatrix.a ** 2 + focusedMatrix.b ** 2);
        const scaleY = Math.sqrt(focusedMatrix.c ** 2 + focusedMatrix.d ** 2);
        const contentItemInfo = getContentItemInfo(focused_item);
        if (contentItemInfo === undefined) throw Error("contentItemInfo is undefined");

        const {
          scale1,
          scale2,
          scale3,
          scale4,
          topFocusBorder,
          leftFocusBorder,
          rightFocusBorder,
          bottomFocusBorder,
          rotateFocusControl,
        } = contentItemInfo.controls;

        topFocusBorder.style.width = `${focused_item.width * contentAreaMatrix.a * scaleX}px`;
        bottomFocusBorder.style.width = `${focused_item.width * contentAreaMatrix.a * scaleX}px`;
        leftFocusBorder.style.height = `${focused_item.height * contentAreaMatrix.a * scaleY}px`;
        rightFocusBorder.style.height = `${focused_item.height * contentAreaMatrix.a * scaleY}px`;

        const halfWidth = (focused_item.width / 2) * contentAreaMatrix.a * scaleX;
        const halfHeight = (focused_item.height / 2) * contentAreaMatrix.a * scaleY;
        const lengthForScaleControls = Math.hypot(halfHeight, halfWidth);
        const controlUIInfo = [
          [scale1, -Math.acos(-halfWidth / lengthForScaleControls), lengthForScaleControls],
          [scale2, -Math.acos(halfWidth / lengthForScaleControls), lengthForScaleControls],
          [scale3, Math.acos(-halfWidth / lengthForScaleControls), lengthForScaleControls],
          [scale4, Math.acos(halfWidth / lengthForScaleControls), lengthForScaleControls],
          [topFocusBorder, -Math.PI / 2, halfHeight],
          [bottomFocusBorder, Math.PI / 2, halfHeight],
          [leftFocusBorder, Math.PI, halfWidth],
          [rightFocusBorder, 0, halfWidth],
          [rotateFocusControl, -Math.PI / 2, halfHeight + 40],
        ];
        for (const [focus_control, angle_offset, length] of controlUIInfo) {
          const isScale = [scale1, scale2, scale3, scale4].includes(focus_control);
          const focus_control_bbox = focus_control.getBoundingClientRect();
          const xCenter = focus_control_bbox.x + focus_control_bbox.width / 2;
          const yCenter = focus_control_bbox.y + focus_control_bbox.height / 2;
          const xPosForScale =
            (() => {
              // the angles used in the switch case is to get the corner that is used to align the scale control properly
              switch (focus_control) {
                case scale1:
                  return (
                    Math.cos(contentItemInfo.focusItemRotation + Math.PI / 4) * Math.hypot(15, 15)
                  );
                case scale2:
                  return (
                    Math.cos(contentItemInfo.focusItemRotation + (3 * Math.PI) / 4) *
                    Math.hypot(15, 15)
                  );
                case scale3:
                  return (
                    Math.cos(contentItemInfo.focusItemRotation + -Math.PI / 4) * Math.hypot(15, 15)
                  );
                case scale4:
                  return (
                    Math.cos(contentItemInfo.focusItemRotation + (-3 * Math.PI) / 4) *
                    Math.hypot(15, 15)
                  );
                default:
                  return null;
              }
            })() + xCenter;
          const yPosForScale =
            (() => {
              switch (focus_control) {
                case scale1:
                  return (
                    Math.sin(contentItemInfo.focusItemRotation + Math.PI / 4) * Math.hypot(15, 15)
                  );
                case scale2:
                  return (
                    Math.sin(contentItemInfo.focusItemRotation + (3 * Math.PI) / 4) *
                    Math.hypot(15, 15)
                  );
                case scale3:
                  return (
                    Math.sin(contentItemInfo.focusItemRotation + -Math.PI / 4) * Math.hypot(15, 15)
                  );
                case scale4:
                  return (
                    Math.sin(contentItemInfo.focusItemRotation + (-3 * Math.PI) / 4) *
                    Math.hypot(15, 15)
                  );
                default:
                  return null;
              }
            })() + yCenter;
          const angleOfControl = contentItemInfo.focusItemRotation + angle_offset;
          const matrix = new DOMMatrix(getComputedStyle(focus_control).transform);
          const xPos = Math.cos(angleOfControl) * length + x + width / 2;
          const yPos = Math.sin(angleOfControl) * length + y + height / 2;
          const xDiff = xPos - (isScale ? xPosForScale : xCenter);
          const yDiff = yPos - (isScale ? yPosForScale : yCenter);
          const hypot = Math.hypot(xDiff, yDiff);
          const angle = Math.acos(xDiff / hypot) * (yDiff === 0 ? 1 : Math.sign(yDiff));
          /* need to make sure I use the angle between the calculated angle and the focusedItemRotation */
          const angle_between = angle - contentItemInfo.focusItemRotation;
          const translateX = Math.cos(angle_between) * hypot;
          const translateY = Math.sin(angle_between) * hypot;

          if (
            translateX !== NaN &&
            translateY !== NaN &&
            isFinite(translateX) &&
            isFinite(translateY)
          ) {
            matrix.translateSelf(translateX, translateY);
            focus_control.style.transform = matrix.toString();
          }
        }
      }
    }
    function setFocusedItem(e) {
      if (e.target.classList.contains("content-item")) {
        pointer_down = true;
        unfocus(e.target);
        const node = e.target.parentNode.removeChild(e.target);
        content_area.appendChild(node);
        focused_item = e.target;
        focused_item.classList.add("focused");
        focused_item.classList.add("grabbing");
        addFocusControls();
        alignFocusControls();
        const bbox = focused_item.getBoundingClientRect();
        offsetForPointer = [
          e.clientX - (bbox.x + bbox.width / 2),
          e.clientY - (bbox.y + bbox.height / 2),
        ];
      }
    }
    function pointerDownHandler(e) {
      setFocusedItem(e);
      if (e.target === selectedFocusUIControl) {
        selectedFocusUIControl.classList.add("grabbing");
      }
    }
    function moveGrabbedItem(e) {
      if (pointer_down === false || selectedFocusUIControl !== null || offsetForPointer === null) {
        return;
      }

      let grabbed_item_bbox = focused_item.getBoundingClientRect();

      // this is the scaleX; also scaleY must be the same
      let content_area_scale = contentAreaMatrix.a;

      const transform = getComputedStyle(focused_item).transform;
      const matrix = new DOMMatrix(transform);
      const originX = grabbed_item_bbox.x + grabbed_item_bbox.width / 2;
      const originY = grabbed_item_bbox.y + grabbed_item_bbox.height / 2;
      const tX = e.clientX - originX - offsetForPointer[0];
      const tY = e.clientY - originY - offsetForPointer[1];

      /*
      the reason scaleX and scaleY is calculated like this below
      is because x and y are calculated like:
      x = ax + cy + tx
      y = bx + dy + ty
      due to the matrix multiplication.

      if I focus only on the basis vectors (x axis and y axis),
      (1, 0) and (0, 1), and plug those values into the x and y equations

      a(1) + c(0) + 0 = a
      b(1) + d(0) + 0 = b

      and

      a(0) + c(1) + 0 = c
      b(0) + d(1) + 0 = d

      if (1, 0) is plugged into the equations, a and b are the only parameters affecting the x axis (scaling of the x)
      if (0, 1) is plugged into the equations, c and d are the only parameters affecting the y axis (scaling of the y)
      */
      const scaleX = Math.sqrt(matrix.a ** 2 + matrix.b ** 2);
      const scaleY = Math.sqrt(matrix.c ** 2 + matrix.d ** 2);
      const hypot = Math.hypot(tX, tY);
      const angle = Math.acos(tX / hypot) * (tY === 0 ? 1 : Math.sign(tY));
      const contentItemInfo = getContentItemInfo(focused_item);
      if (contentItemInfo === undefined) throw Error("content item info is undefined");
      const angle_between = angle - contentItemInfo.focusItemRotation;
      const tx_amt = Math.cos(angle_between) * hypot;
      const ty_amt = Math.sin(angle_between) * hypot;
      if (tx_amt !== NaN && ty_amt !== NaN && isFinite(tx_amt) && isFinite(ty_amt)) {
        matrix.translateSelf(
          tx_amt / contentAreaMatrix.a / scaleX,
          ty_amt / contentAreaMatrix.a / scaleY,
        );
        focused_item.style.transform = matrix.toString();
      }
      alignFocusControls();
    }
    function transformToRotatedCoordinates(control_bbox, x, y, rotation_angle) {
      const controlXCenter = control_bbox.x + control_bbox.width / 2;
      const controlYCenter = control_bbox.y + control_bbox.height / 2;
      const diffX = x - controlXCenter;
      const diffY = y - controlYCenter;
      const dist = Math.hypot(diffX, diffY);
      const angle = Math.acos(diffX / dist) * (diffY === 0 ? 1 : Math.sign(diffY));
      const angle_between = angle - rotation_angle;
      return [
        Math.cos(angle_between) * dist + controlXCenter,
        Math.sin(angle_between) * dist + controlYCenter,
      ];
    }
    function moveFocusUIControl(e) {
      if (selectedFocusUIControl !== null) {
        const transform = getComputedStyle(focused_item).transform;
        const matrix = new DOMMatrix(transform);
        const scaleXOfFocusElement = Math.sqrt(matrix.a ** 2 + matrix.b ** 2);
        const scaleYOfFocusElement = Math.sqrt(matrix.c ** 2 + matrix.d ** 2);
        const { x, y, width, height } = focused_item.getBoundingClientRect();
        const contentItemInfo = getContentItemInfo(focused_item);
        if (contentItemInfo === undefined) throw Error("contentItemInfo is undefined");
        const actualWidth = focused_item.width * contentAreaMatrix.a * scaleXOfFocusElement;
        const actualHeight = focused_item.height * contentAreaMatrix.a * scaleYOfFocusElement;
        const [topLeftCorner, topRightCorner, bottomLeftCorner, bottomRightCorner] =
          calculateCornersBasedOnRotation(focused_item);
        const {
          scale1,
          scale2,
          scale3,
          scale4,
          topFocusBorder,
          leftFocusBorder,
          rightFocusBorder,
          bottomFocusBorder,
          rotateFocusControl,
        } = contentItemInfo.controls;
        function getScaling(eventX, eventY, scale_element) {
          switch (scale_element) {
            case scale1: {
              const [topRightX, topRightY] = topRightCorner;
              const [bottomLeftX, bottomLeftY] = bottomLeftCorner;
              const scaleX = Math.hypot(eventX - topRightX, eventY - topRightY) / actualWidth;
              const scaleY = Math.hypot(eventX - bottomLeftX, eventY - bottomLeftY) / actualHeight;
              return [scaleX, scaleY];
            }
            case scale2: {
              const [topLeftX, topLeftY] = topLeftCorner;
              const [bottomRightX, bottomRightY] = bottomRightCorner;
              const scaleX = Math.hypot(eventX - topLeftX, eventY - topLeftY) / actualWidth;
              const scaleY =
                Math.hypot(eventX - bottomRightX, eventY - bottomRightY) / actualHeight;
              return [scaleX, scaleY];
            }
            case scale3: {
              const [topLeftX, topLeftY] = topLeftCorner;
              const [bottomRightX, bottomRightY] = bottomRightCorner;
              const scaleX = Math.hypot(eventX - bottomRightX, eventY - bottomRightY) / actualWidth;
              const scaleY = Math.hypot(eventX - topLeftX, eventY - topLeftY) / actualHeight;
              return [scaleX, scaleY];
            }
            case scale4: {
              const [topRightX, topRightY] = topRightCorner;
              const [bottomLeftX, bottomLeftY] = bottomLeftCorner;
              const scaleX = Math.hypot(eventX - bottomLeftX, eventY - bottomLeftY) / actualWidth;
              const scaleY = Math.hypot(eventX - topRightX, eventY - topRightY) / actualHeight;
              return [scaleX, scaleY];
            }
          }
          throw Error("scale_element is not any of the focus scale controls");
        }
        function getScaleOrigin(scale_control) {
          switch (scale_control) {
            case scale1:
              return [focused_item.width / 2, focused_item.height / 2];
            case scale2:
              return [-focused_item.width / 2, focused_item.height / 2];
            case scale3:
              return [focused_item.width / 2, -focused_item.height / 2];
            case scale4:
              return [-focused_item.width / 2, -focused_item.height / 2];
          }
          throw Error("scale_element is not any of the focus scale controls");
        }
        if ([scale1, scale2, scale3, scale4].includes(selectedFocusUIControl)) {
          const eventX = e.clientX - offsetForPointer[0];
          const eventY = e.clientY - offsetForPointer[1];
          const [scaleX, scaleY] = getScaling(eventX, eventY, selectedFocusUIControl);
          const [scaleOriginX, scaleOriginY] = getScaleOrigin(selectedFocusUIControl);
          matrix.scaleSelf(scaleX, scaleY, 1, scaleOriginX, scaleOriginY);
        } else if (selectedFocusUIControl === rotateFocusControl) {
          const diffx = e.clientX - (x + width / 2);
          const diffy = e.clientY - (y + height / 2);
          const hypot = Math.hypot(diffx, diffy);
          const angle_of_mouse = Math.acos(diffx / hypot) * (diffy === 0 ? 1 : Math.sign(diffy));

          matrix.scaleSelf(1 / scaleXOfFocusElement, 1 / scaleYOfFocusElement);
          matrix.rotateSelf(
            ((angle_of_mouse + Math.PI / 2 - contentItemInfo.focusItemRotation) * 180) / Math.PI,
          );
          matrix.scaleSelf(scaleXOfFocusElement, scaleYOfFocusElement);

          for (const ui_part of Object.values(contentItemInfo.controls)) {
            const bbox = ui_part.getBoundingClientRect();
            const ui_part_x_center = bbox.x + bbox.width / 2;
            const ui_part_y_center = bbox.y + bbox.height / 2;
            const diffX = ui_part_x_center - (x + width / 2);
            const diffY = ui_part_y_center - (y + height / 2);
            const hypot = Math.hypot(diffX, diffY);
            const matrix = new DOMMatrix(getComputedStyle(ui_part).transform);
            // to rotate around a point without changing the transform origin,
            // i need to do a translation and keep the rotation angle for the current
            // ui control 90 degress offset for the angle between center of ui control
            // and intended rotation point
            const new_x_pos = Math.cos(angle_of_mouse) * hypot + (x + width / 2);
            const new_y_pos = Math.sin(angle_of_mouse) * hypot + (y + height / 2);
            const x_translate_amt = new_x_pos - ui_part_x_center;
            const y_translate_amt = new_y_pos - ui_part_y_center;

            const target_angle = angle_of_mouse + Math.PI / 2;
            matrix.rotateSelf(((target_angle - contentItemInfo.focusItemRotation) * 180) / Math.PI);

            ui_part.style.transform = matrix.toString();
          }

          contentItemInfo.focusItemRotation = angle_of_mouse + Math.PI / 2;
        }
        focused_item.style.transform = matrix.toString();
        alignFocusControls();
      }
    }
    function pointerMoveHandler(e) {
      moveFocusUIControl(e);
      moveGrabbedItem(e);
    }
    function pointerUpHandler(e) {
      pointer_down = false;
      unfocus(e.target);
      if (focused_item) focused_item.classList.remove("grabbing");
      if (selectedFocusUIControl !== null) {
        selectedFocusUIControl.classList.remove("grabbing");
      }
      selectedFocusUIControl = null;
    }
    function getContentClipboard() {
      navigator.clipboard.read().then((items) => {
        const images = items.filter((i) => {
          return i.types.some((t) => t.includes("image") || t.includes("text"));
        });
        images.forEach((i) => {
          const image_mime_type = i.types.find((t) => t.includes("image"));
          if (image_mime_type) {
            i.getType(image_mime_type).then((blob) => {
              const imageUrl = URL.createObjectURL(blob);
              const img = new Image();
              img.classList.add("content-item");
              img.src = imageUrl;
              img.draggable = false;
              img.decode().then(() => {
                if (focused_item) removeFocusControls();
                contentItems.push({
                  item: img,
                  focusItemRotation: 0,
                  controls: createFocusControls(),
                });
                focused_item = img;
                content_area.appendChild(img);
              });
            });
          }
          const text_plain_svg = i.types.find((t) => t === "text/plain");
          if (text_plain_svg) {
            i.getType(text_plain_svg).then((blob) => {
              blob.text().then((t) => {
                const d = new DOMParser();
                const parsedDocument = d.parseFromString(t, "image/svg+xml");
                if (!parsedDocument.querySelector("parsererror")) {
                  const svg = parsedDocument.documentElement.outerHTML;
                  const img = new Image();
                  img.onpointerdown = setFocusedItem;
                  img.classList.add("content-item");
                  img.src = `data:image/svg+xml;base64,${btoa(svg)}`;
                  img.draggable = false;
                  img.decode().then(() => {
                    if (focused_item) removeFocusControls();
                    contentItems.push({
                      item: img,
                      focusItemRotation: 0,
                      controls: createFocusControls(),
                    });
                    focused_item = img;
                    content_area.appendChild(img);
                  });
                } else {
                  throw Error("TODO");
                }
              });
            });
          }
        });
      });
    }
    const paste_btn = document.getElementById("paste-btn");
    paste_btn.onclick = getContentClipboard;
    const add_txt_btn = document.getElementById("add-txt-btn");
    add_txt_btn.onclick = function () {
      const svg = document.createElementNS();
      content_area.appendChild();
    };
    document.addEventListener("paste", getContentClipboard);
    document.addEventListener("pointermove", pointerMoveHandler);
    document.addEventListener("pointerup", pointerUpHandler);
    document.addEventListener("pointerdown", pointerDownHandler);
    document.addEventListener("copy", async () => {
      if (focused_item) {
        await navigator.clipboard.write([
          new ClipboardItem(
            focused_item.src.startsWith("data:image/svg+xml;base64")
              ? {
                  "text/plain": atob(
                    focused_item.src.slice("data:image/svg+xml;base64".length + 1),
                  ),
                }
              : {
                  "image/png": await fetch(focused_item.src)
                    .then((r) => r.blob())
                    .then((blob) => blob),
                },
          ),
        ]);
      }
    });
    document.addEventListener(
      "wheel",
      (e) => {
        if (e.deltaMode === WheelEvent.DOM_DELTA_PIXEL) {
          e.preventDefault();
          const { x, y, width, height } = content_area.getBoundingClientRect();
          if (e.ctrlKey) {
            // zoom event
            // ctrlKey is true when zooming
            let scale = Math.sign(e.deltaY) === 1 ? 0.97 : 1.03;
            const diff_x = e.clientX - (x + width / 2);
            const diff_y = e.clientY - (y + height / 2);
            contentAreaMatrix.scaleSelf(
              scale,
              scale,
              scale,
              diff_x / contentAreaMatrix.a,
              diff_y / contentAreaMatrix.a,
            );
          } else {
            // moving around event
            contentAreaMatrix.translateSelf(-e.deltaX, -e.deltaY);
          }
          content_area.style.transform = contentAreaMatrix.toString();
          alignFocusControls();
        }
      },
      { passive: false },
    );
    document.addEventListener("keydown", (e) => {
      if (e.key === "Backspace") {
        if (focused_item) {
          content_area.removeChild(focused_item);
          removeFocusControls();
          const contentItemIdx = contentItems.findIndex(
            (contentItem) => contentItem.item === focused_item,
          );
          contentItems.splice(contentItemIdx, 1);
          focused_item = null;
        }
      }
    });
  </script>
