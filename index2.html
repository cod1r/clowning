<!doctype html>
<head>
  <style>
    body {
      padding: 0;
      margin: 0;
    }
  </style>
</head>
<html>
  <body>
    <div style="font-family: &quot;Times Roman&quot;; font-size: 50px"></div>
    <img id="img" width="800" height="800" />
    <input type="text" />
  </body>
  <script>
    const img = document.querySelector("img");
    const div = document.querySelector("div");
    const inpt = document.querySelector("input");
    const keys = "abcdefghijklmnopqrstuvwxyz !@";
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.id = "svg";
    svg.style.width = "500px";
    svg.style.height = "500px";
    svg.setAttribute("viewBox", "0 0 500 500");
    svg.setAttribute("xmlns", "http://www.w3.org/2000/svg");
    let str = "";
    function handler(e) {
      const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
      text.setAttribute("font-family", "Times New Roman");
      text.setAttribute("font-size", "50px");
      text.setAttribute("dominant-baseline", "hanging");
      text.setAttribute("fill", "black");
      if (keys.includes(e.key.toLowerCase())) {
        str += e.key;
        div.appendChild(document.createTextNode(e.key));
      } else if (e.key === "Backspace") {
        str = str.slice(0, str.length - 1);
        div.textContent = div.textContent.slice(0, div.textContent.length - 1);
      }
      svg.lastElementChild?.remove();
      text.appendChild(document.createTextNode(str));
      svg.appendChild(text);
      document.getElementById("svg")?.remove();
      document.body.prepend(svg);
      img.src = `data:image/svg+xml,${svg.outerHTML}`;
    }
    document.onkeydown = handler;
    inpt.oninput = handler;
  </script>
</html>
