<!doctype html>
<head>
  <style>
    body {
      padding: 0;
      margin: 0;
    }
  </style>
</head>
<html>
  <body>
    <div style="width: 50px; height: 50px; background-color: red"></div>
    <input type="range" min="0" max="6.28" step="0.01" value="0" />
  </body>
  <script>
    const d = document.querySelector("div");
    const i = document.querySelector("input[type='range']");
    const matrix = new DOMMatrix();
    matrix.translateSelf(10, 10);
    d.style.transform = matrix.toString();
    let current_rotation = 0;
let current_scalingX = 1;
let current_scalingY = 1;
    i.oninput = (e) => {
const scaleX = Math.sqrt(matrix.a ** 2 + matrix.b ** 2)
const scaleY = Math.sqrt(matrix.c ** 2 + matrix.d ** 2)
matrix.scaleSelf(1 / scaleX, 1 / scaleY)
      matrix.rotateSelf(((+e.target.value - current_rotation) * 180) / Math.PI);
matrix.scaleSelf(2, 1)
current_scalingX = 2
current_scalingY = 1
      current_rotation = +e.target.value;
      d.style.transform = matrix.toString();
      console.log((current_rotation * 180) / Math.PI);
    };
  </script>
</html>
