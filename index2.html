<!doctype html>
<head>
  <style>
    body {
      padding: 0;
      margin: 0;
    }
  </style>
</head>
<html>
  <body>
    <img id="img" width="800" height="800" />
    <div style="font-family='Times Roman'"></div>
  </body>
  <script>
    const img = document.querySelector("img")
    const div = document.querySelector("div")
    const keys = "abcdefghijklmnopqrstuvwxyz !@"
    const offscreenCanvas = new OffscreenCanvas(500, 500)
    const ctx = offscreenCanvas.getContext("2d")
    let horizontal_pos = 0
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg")
    svg.setAttribute("viewBox", "0 0 500 500")
    svg.setAttribute("xmlns", "http://www.w3.org/2000/svg")
    document.onkeydown = (e) => {
      if (keys.includes(e.key)) {
        const text = document.createElementNS("http://www.w3.org/2000/svg", "text")
        text.setAttribute("font-family", "Times New Roman")
        text.setAttribute("x", `${horizontal_pos}`)
        text.setAttribute("y", "10")
        text.setAttribute("fill", "black")
        text.appendChild(document.createTextNode(e.key))
        const size = ctx.measureText(e.key)
        horizontal_pos += (size.actualBoundingBoxLeft + size.actualBoundingBoxRight)
        svg.appendChild(text)
      div.appendChild(document.createTextNode(e.key))
      } else if (e.key === "Backspace") {
        console.log(svg.lastElementChild.textContent)
        const size = ctx.measureText(svg.lastElementChild.textContent)
        horizontal_pos -= (size.actualBoundingBoxLeft + size.actualBoundingBoxRight)
        svg.lastElementChild.remove()
      div.lastElementChild.remove()
      }
      img.src = `data:image/svg+xml,${svg.outerHTML}`
    }
  </script>
</html>
